<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAN Notification</title>
    <!--PA_PAYLOAD-->

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        display: grid;
        place-content: center;
      }

      /* Xbox presets: the theme's own animation stays in the icon slot and the real
         achievement icon is shown as a circle on the far right. */
      #rightachicon { display: none; }
      body[rightachicon] .wrapper#achcont { grid-template-columns: auto 1fr auto; }
      body[rightachicon] #rightachicon {
        --rsize: calc(var(--notifyheight) - (10px * var(--scale)));
        display: grid;
        grid-column: 3;
        grid-row-start: 1;
        place-self: center;
        width: var(--rsize);
        height: var(--rsize);
        margin-inline: calc(2px * var(--scale)) calc(5px * var(--scale));
        border-radius: 50%;
        overflow: hidden;
        opacity: 0;
        animation:
          rightachicon-in calc(var(--transition) * 2) calc(var(--transition) * 8.5) forwards,
          rightachicon-out calc(var(--transition) * 2) calc(var(--displaytime) - (var(--transition) * 14)) forwards;
      }
      body[fastanim][rightachicon] #rightachicon {
        animation:
          rightachicon-in calc(var(--transition) * 2) calc(var(--transition) * 8.5) forwards,
          rightachicon-out calc(var(--transition) * 2) calc(var(--displaytime) - (var(--transition) * 2)) forwards;
      }
      body[rightachicon] #rightachicon img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      @keyframes rightachicon-in { to { opacity: 1; } }
      @keyframes rightachicon-out { to { opacity: 0; } }
    
      /* Xbox presets: laurels and the rarity pill hang below the card, so the card must not clip them.
         The background keeps its own rounded clipping. */
      body[san-preset="xboxone"] .wrapper#achcont { overflow: visible; }
      body[san-preset="xboxone"] .wrapper#achcontent { overflow: hidden; }

      /* Rarity pill (same look as the Achievements app's own notification badge). */
      #pa-rarity-pill {
        position: fixed; z-index: 2147483647; box-sizing: border-box;
        min-width: 34px; padding: 2px 7px; border: 1px solid rgba(255,255,255,.42);
        border-radius: 999px; background: rgba(10,13,18,.82); color: #fff;
        font-family: "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; line-height: 1.25;
        opacity: 0; visibility: hidden; text-align: center; white-space: nowrap; pointer-events: none;
        transform: translateX(-50%); text-shadow: 0 1px 2px rgba(0,0,0,.9);
        box-shadow: 0 2px 8px rgba(0,0,0,.35);
      }
      #pa-rarity-pill.t-gold { border-color: rgba(249,199,79,.88); color: #ffe08a; }
      #pa-rarity-pill.t-silver { border-color: rgba(199,208,217,.88); color: #edf3f8; }
      #pa-rarity-pill.t-diamond { border-color: rgba(92,225,255,.88); color: #b8f1ff; }
      #pa-rarity-pill.t-sapphire { border-color: rgba(61,123,255,.88); color: #a9c4ff; }
      #pa-rarity-pill.t-bronze { border-color: rgba(205,127,50,.88); color: #efb475; }
    </style>
  </head>
  <body>
    <script>
      /* PlayniteAchievements host: stand-in for the Electron preload API the page was written
         against. The payload is injected into window.__SAN_PAYLOAD__ before this page loads. */
      window.api = {
        onNotification(cb) { window.__sanCb = cb; },
        notificationRenderReady() {
          try { window.chrome.webview.postMessage("san-ready"); } catch (e) {}
        },
      };
    </script>

    <script>
      function safeNumber(value, fallback = 0) {
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
      }

      function fileUrl(value) {
        if (!value) return "";
        const raw = String(value);
        if (raw.startsWith("file://") || raw.startsWith("http://") || raw.startsWith("https://")) {
          return raw;
        }
        return `file:///${raw.replace(/\\/g, "/")}`;
      }

      function cssUrl(value) {
        const url = fileUrl(value);
        return url ? `url("${url.replace(/"/g, '\\"')}")` : "none";
      }

      function setVar(name, value) {
        document.documentElement.style.setProperty(name, String(value));
      }

      function loadCss(id, href) {
        return new Promise((resolve) => {
          if (!href || document.getElementById(id)) {
            resolve();
            return;
          }
          const link = document.createElement("link");
          link.id = id;
          link.rel = "stylesheet";
          link.href = href;
          link.onload = () => resolve();
          link.onerror = () => resolve();
          document.head.appendChild(link);
        });
      }

      function getPositionAttribute(position) {
        const normalized = String(position || "").toLowerCase();
        const map = {
          "center-bottom": "bottomcenter",
          "center-top": "topcenter",
          "top-right": "topright",
          "bottom-right": "bottomright",
          "middle-right": "topright",
          "top-left": "topleft",
          "bottom-left": "bottomleft",
          "middle-left": "topleft",
        };
        return map[normalized] || "bottomcenter";
      }

      function getPercentInfo(payload) {
        const explicitTier = String(payload?.rarityTier || payload?.trophyType || "")
          .trim()
          .toLowerCase();
        const tierFromPayload =
          explicitTier === "diamond" ||
          explicitTier === "sapphire" ||
          explicitTier === "gold" ||
          explicitTier === "silver" ||
          explicitTier === "bronze" ||
          (explicitTier === "psnplatinum" && payload?.isPsnPlatinum === true)
            ? explicitTier
            : "";
        const rawValue = payload?.rarityPct;
        const raw =
          rawValue === null || rawValue === undefined || rawValue === ""
            ? NaN
            : Number(rawValue);
        const hasPercent = Number.isFinite(raw);
        const value = hasPercent ? Math.max(raw, 0.1) : 50;
        // Bronze 50.1-100%, Silver 20.1-50%, Gold 5.1-20%, Sapphire 1.01-5%, Diamond 0-1%.
        const diamondlimit = 1;
        const rarity = 5;
        const semirarity = 20;
        const tier =
          tierFromPayload ||
          (!hasPercent
            ? "bronze"
            : value <= diamondlimit
            ? "diamond"
            : value <= rarity
            ? "sapphire"
            : value <= semirarity
              ? "gold"
              : value <= 50
                ? "silver"
                : "bronze");
        return { value, rarity, semirarity, tier, hasPercent };
      }

      function shouldShowSanPercent(payload, customisation) {
        if (!getPercentInfo(payload).hasPercent) return false;
        if (payload?.showRarityPercentage === false) return false;
        if (payload?.showRarityPercentage === true) return true;
        if (customisation.usepercent) return true;
        return payload?.isRare === true;
      }

      function pickRarityAsset(value, tier) {
        if (Array.isArray(value)) {
          // A preset lists its tier icons as [bronze, silver, gold, sapphire, psn platinum, diamond].
          // The PSN Platinum tier falls back to the gold icon in a preset made before it existed,
          // and Diamond falls back to the Sapphire icon.
          const index =
            tier === "diamond"
              ? 5
              : tier === "psnplatinum"
              ? 4
              : tier === "sapphire"
                ? 3
                : tier === "gold"
                  ? 2
                  : tier === "silver"
                    ? 1
                    : 0;
          return (
            value[index] ||
            (tier === "diamond" ? value[3] || value[2] : "") ||
            (tier === "psnplatinum" ? value[3] || value[2] : "") ||
            (tier === "sapphire" ? value[2] : "") ||
            value[0] ||
            ""
          );
        }
        return value || "";
      }

      function getPresetIcons(customisation) {
        const preset = String(customisation?.preset || "default").toLowerCase();
        const icons = customisation?.customicons || {};
        return icons[customisation.preset] || icons[preset] || {};
      }

      function getPresetIndexValue(customisation, key) {
        const icons = getPresetIcons(customisation);
        const value = Number(icons?.index?.[key]);
        return Number.isFinite(value) ? value : 0;
      }

      function hasIndexedSanPercent(customisation) {
        return getPresetIndexValue(customisation, "percent") > 0;
      }

      function shouldRenderIndexedPercentAsBadge(customisation) {
        return customisation?.percentbadge === true || customisation?.sspercentbadge === true;
      }

      function isScreenshotSanMode(payload, customisation) {
        return customisation?.ss === true || payload?.screenshotMode === true;
      }

      function getSanElementPosition(payload, customisation, key, fallbackKey, ssFallbackKey) {
        const indexed = getPresetIndexValue(customisation, key);
        if (indexed > 0) return indexed;
        if (isScreenshotSanMode(payload, customisation) && ssFallbackKey) {
          return safeNumber(customisation[ssFallbackKey], 0);
        }
        return safeNumber(customisation[fallbackKey], 0);
      }

      function getSanPercentPosition(payload, customisation) {
        return getSanElementPosition(payload, customisation, "percent", "percentpos", "sspercentpos");
      }

      function getSanDecorationPosition(payload, customisation) {
        return getSanElementPosition(payload, customisation, "decoration", "decorationpos", "ssdecorationpos");
      }

      function getSanHiddenIconPosition(payload, customisation) {
        return getSanElementPosition(payload, customisation, "hiddenicon", "hiddeniconpos", "sshiddeniconpos");
      }

      function resolveSanBadgePosition(value) {
        const normalized = String(value || "bottomcenter").toLowerCase().replace(/[\s_-]+/g, "");
        const map = {
          top: { left: "50%", right: "auto", top: "0", bottom: "auto", translate: "-50% -50%" },
          bottom: { left: "50%", right: "auto", top: "auto", bottom: "0", translate: "-50% 50%" },
          left: { left: "0", right: "auto", top: "50%", bottom: "auto", translate: "-50% -50%" },
          right: { left: "auto", right: "0", top: "50%", bottom: "auto", translate: "50% -50%" },
          topcenter: { left: "50%", right: "auto", top: "0", bottom: "auto", translate: "-50% -50%" },
          bottomcenter: { left: "50%", right: "auto", top: "auto", bottom: "0", translate: "-50% 50%" },
          topleft: { left: "0", right: "auto", top: "0", bottom: "auto", translate: "-50% -50%" },
          topright: { left: "auto", right: "0", top: "0", bottom: "auto", translate: "50% -50%" },
          bottomleft: { left: "0", right: "auto", top: "auto", bottom: "0", translate: "-50% 50%" },
          bottomright: { left: "auto", right: "0", top: "auto", bottom: "0", translate: "50% 50%" },
          center: { left: "50%", right: "auto", top: "50%", bottom: "auto", translate: "-50% -50%" },
        };
        return map[normalized] || map.bottomcenter;
      }

      function applySanBadgePosition(badge, position) {
        badge.style.left = position.left;
        badge.style.right = position.right;
        badge.style.top = position.top;
        badge.style.bottom = position.bottom;
        badge.style.translate = position.translate;
      }

      function getSanTierValue(customisation, flagKey, prefix, fallback, tier) {
        if (!customisation?.[flagKey]) return fallback;
        if (tier === "psnplatinum") {
          return (
            customisation[`${prefix}platinum`] ||
            customisation[`${prefix}sapphire`] ||
            customisation[`${prefix}gold`] ||
            fallback
          );
        }
        if (tier === "diamond") {
          return (
            customisation[`${prefix}diamond`] ||
            customisation[`${prefix}sapphire`] ||
            customisation[`${prefix}gold`] ||
            fallback
          );
        }
        if (tier === "sapphire") {
          return (
            customisation[`${prefix}sapphire`] ||
            customisation[`${prefix}gold`] ||
            fallback
          );
        }
        if (tier === "gold") return customisation[`${prefix}gold`] || fallback;
        if (tier === "silver") return customisation[`${prefix}silver`] || fallback;
        return customisation[`${prefix}bronze`] || fallback;
      }

      function getActiveSanBadgeValue(payload, customisation, key, fallback = "") {
        const ssKey = `ss${key}`;
        if (isScreenshotSanMode(payload, customisation) && customisation[ssKey] !== undefined) {
          return customisation[ssKey];
        }
        return customisation[key] !== undefined ? customisation[key] : fallback;
      }

      function getPlatinumIcon(customisation) {
        const icons = customisation?.customicons || {};
        return icons.plat || icons.platinum || customisation?.platIcon || "";
      }

      function setBodyAttributes(payload, customisation) {
        const body = document.body;
        body.removeAttribute("style");
        for (const attr of Array.from(body.attributes)) {
          if (attr.name !== "class") body.removeAttribute(attr.name);
        }

        const preset = String(customisation.preset || "default").toLowerCase();
        const percent = getPercentInfo(payload);
        body.setAttribute("san-preset", preset);
        body.setAttribute(getPositionAttribute(payload?.position || customisation.pos), "");
        if (percent.tier) body.setAttribute(`tier-${percent.tier}`, "");
        if (payload?.trophyType) {
          body.setAttribute(`trophy-${String(payload.trophyType).toLowerCase()}`, "");
        }
        if (customisation.bgstyle) body.setAttribute(customisation.bgstyle, "");
        if (customisation.bgonly) body.setAttribute("bgonly", "");
        if (customisation.alldetails) body.setAttribute("alldetails", "");
        // The animated icon glow is tied to the "rare" attribute. Only the Gold
        // (5.1-20%), Sapphire (1.01-5%) and Diamond (0-1%) ranges get it; Silver stays plain.
        if (
          payload?.isRare &&
          (percent.tier === "gold" || percent.tier === "sapphire" || percent.tier === "diamond")
        ) {
          body.setAttribute("rare", "");
        }
        // The PSN Platinum gets the same animated glow behind its icon as Gold and Sapphire.
        if (payload?.isPsnPlatinum === true) body.setAttribute("rare", "");
        if (payload?.isPlatinum) body.setAttribute("plat", "");
        if (customisation.fastanim) body.setAttribute("fastanim", "");
        if (isScreenshotSanMode(payload, customisation)) body.setAttribute("ss", "");
        if (customisation.ssdisplay) body.setAttribute("ssdisplay", "");
        if (!customisation.iconanim) body.setAttribute("noiconanim", "");
      }

      function applyCustomFont(customisation) {
        if (!customisation.customfont) return;
        const style = document.createElement("style");
        style.textContent = `
          @font-face {
            font-family: "customfont";
            src: url("${fileUrl(customisation.customfont)}");
          }
        `;
        document.head.appendChild(style);
      }

      function setTextElements(payload, customisation, percent) {
        const icons = getPresetIcons(customisation);
        const useScreenshotElems = isScreenshotSanMode(payload, customisation);
        const elems = useScreenshotElems && Array.isArray(customisation.sselems)
          ? customisation.sselems
          : Array.isArray(customisation.elems)
          ? customisation.elems
          : useScreenshotElems && Array.isArray(icons.sselems)
            ? icons.sselems
            : Array.isArray(icons.elems)
            ? icons.elems
            : ["unlockmsg", "title", "desc"];
        const strings = {
          unlockmsg: customisation.unlockmsg || "Achievement Unlocked",
          title: payload?.displayName || "Achievement Unlocked",
          desc: payload?.description || "",
        };
        const filter = elems.filter((elem) => elem !== null);

        const offset = ["steamdeck", "epicgames", "ps5"].includes(customisation.preset) &&
          filter.length < 3
          ? 1
          : 0;
        const positions = new Map([
          ["unlockmsg", [1, 0]],
          ["title", [2 - offset, 1 - offset]],
          ["desc", [3 - offset, 2 - offset]],
        ]);
        const decorationPosition = getSanDecorationPosition(payload, customisation);
        const hiddenIconPosition = getSanHiddenIconPosition(payload, customisation);
        const indexedPercent = hasIndexedSanPercent(customisation);
        const badgeOnlyIndexedPercent = indexedPercent && shouldRenderIndexedPercentAsBadge(customisation);
        const textPercentPosition = badgeOnlyIndexedPercent
          ? 0
          : getSanPercentPosition(payload, customisation);
        const percentText = shouldShowSanPercent(payload, customisation) && textPercentPosition > 0
          ? ` (${percent.value.toFixed(1)}%)`
          : "";

        for (const [id, [pos, index]] of positions.entries()) {
          const el = document.getElementById(id);
          if (!el) continue;
          const typeValue = filter[index] || "";
          const decoration = pos === decorationPosition
            ? `<span id="decoration"></span>`
            : "";
          const hiddenIcon =
            customisation.showhiddenicon && payload?.hidden === true &&
            pos === hiddenIconPosition
              ? `<span id="hiddenicon"></span>`
              : "";
          const percentPart =
            pos === textPercentPosition ? percentText : "";
          const html = `${decoration}${hiddenIcon}${strings[typeValue] || ""}${percentPart}`;
          el.innerHTML = html;
          if (!el.textContent) el.innerHTML = "";
        }

        document.body.toggleAttribute("alldetails", filter.length === 3);
        setVar("--decorationindex", decorationPosition || 1);
      }

      function setBadge(payload, customisation, percent) {
        const wrapper = document.getElementById("achiconwrapper");
        const indexedPercent = hasIndexedSanPercent(customisation);
        const screenshotBadge = isScreenshotSanMode(payload, customisation) && customisation.sspercentbadge;
        const indexedBadge = indexedPercent && shouldRenderIndexedPercentAsBadge(customisation);
        if (!wrapper || (!customisation.percentbadge && !screenshotBadge && !indexedBadge)) return;
        if (!shouldShowSanPercent(payload, { ...customisation, usepercent: true })) return;
        const badge = document.createElement("span");
        badge.id = "badge";
        const usesBadgeImage = getActiveSanBadgeValue(payload, customisation, "percentbadgeimg") === true;
        if (usesBadgeImage) badge.setAttribute("badgeimg", "");
        badge.textContent = usesBadgeImage ? "" : `${percent.value.toFixed(1)}%`;

        if (indexedBadge && !customisation.percentbadge && !screenshotBadge) {
          Object.assign(badge.style, {
            left: "50%",
            top: "calc(100% + 0.15rem)",
            right: "auto",
            bottom: "auto",
            translate: "-50% 0",
            whiteSpace: "nowrap",
            zIndex: "120",
          });
        } else {
          const position = isScreenshotSanMode(payload, customisation)
            ? customisation.sspercentbadgepos
            : customisation.percentbadgepos;
          const badgePosition = resolveSanBadgePosition(position);
          applySanBadgePosition(badge, badgePosition);
        }
        const offsetX = safeNumber(getActiveSanBadgeValue(payload, customisation, "percentbadgex"), 0);
        const offsetY = safeNumber(getActiveSanBadgeValue(payload, customisation, "percentbadgey"), 0);
        if (offsetX) badge.style.marginLeft = `calc(${offsetX}px * var(--scale))`;
        if (offsetY) badge.style.marginTop = `calc(${offsetY}px * var(--scale))`;
        wrapper.appendChild(badge);
      }

      function applySanVariables(payload, customisation) {
        const theme = payload?.sanTheme || {};
        const dimensions = theme.presetDimensions || {};
        const scale = Math.max(0.1, safeNumber(customisation.scale, 100) / 100);
        const percent = getPercentInfo(payload);
        const icons = getPresetIcons(customisation);
        const decoration = pickRarityAsset(icons.decoration || "", percent.tier);
        const gameIcon =
          payload?.iconPath ||
          payload?.gameIconPath ||
          payload?.appIconPath ||
          customisation.gameicon ||
          "";
        const logo = pickRarityAsset(
          customisation.replacelogo && icons.decoration
            ? icons.decoration
            : customisation.usegameicon && gameIcon
              ? gameIcon
              : icons.logo || customisation.logo || "",
          percent.tier,
        );
        const bgImage =
          customisation.bgstyle === "gameart"
            ? payload?.headerPath || customisation.gameart || customisation.bgImage || customisation.bgimg
            : customisation.bgstyle === "bgimg"
              ? customisation.bgimg || customisation.bgImage
              : "";

        const durationMs = Number(payload?.durationMs);
        const displayTimeSec = Math.max(
          1,
          Number.isFinite(durationMs) && durationMs > 0
            ? durationMs / 1000
            : safeNumber(customisation.displaytime, 8),
        );
        const requestedTransitionMs = Math.max(50, safeNumber(customisation.transition, 150));
        const transitionMs = Math.max(
          50,
          Math.min(requestedTransitionMs, Math.floor((displayTimeSec * 1000) / 16)),
        );

        setVar("--notifywidth", `${Math.max(1, safeNumber(dimensions.width, 300)) * scale}px`);
        setVar("--notifyheight", `${Math.max(1, safeNumber(dimensions.height, 50)) * scale}px`);
        setVar("--displaytime", `${displayTimeSec}s`);
        setVar("--transition", `${transitionMs}ms`);
        setVar("--scale", scale);
        setVar("--gradientangle", `${safeNumber(customisation.gradientangle, 90)}deg`);
        setVar("--bgimg", cssUrl(bgImage));
        setVar("--gameart", cssUrl(payload?.headerPath || customisation.gameart));
        setVar("--gameicon", cssUrl(gameIcon || payload?.iconPath));
        setVar("--base64", cssUrl(customisation.base64));
        setVar("--bgimgbrightness", `${safeNumber(customisation.bgimgbrightness, 100)}%`);
        setVar("--brightness", `${safeNumber(customisation.brightness, 100)}%`);
        setVar("--roundness", `${(safeNumber(customisation.roundness, 0) / 4) * scale}px`);
        setVar("--fontsize", safeNumber(customisation.fontsize, 100) / 100);
        setVar("--opacity", safeNumber(customisation.opacity, 100) / 100);
        setVar(
          "--iconroundness",
          safeNumber(customisation.iconroundness, 0) === 100
            ? "50%"
            : `${(safeNumber(customisation.iconroundness, 0) / 6) * scale}px`,
        );
        setVar(
          "--fontoutline",
          customisation.fontoutline
            ? `${scale * safeNumber(customisation.fontoutlinescale, 1)}px ${customisation.fontoutlinecolor || "#000"}`
            : "none",
        );
        setVar(
          "--fontshadow",
          customisation.fontshadow
            ? `drop-shadow(${safeNumber(customisation.fontshadowx, 0)}px ${safeNumber(customisation.fontshadowy, 0)}px ${scale * safeNumber(customisation.fontshadowscale, 1)}px ${customisation.fontshadowcolor || "#000"})`
            : "none",
        );
        setVar("--iconanimcolor", customisation.iconanimcolor || "#ffb84e");
        setVar("--iconshadowcolor", customisation.iconshadowcolor || "#ffb84e99");
        setVar("--logo", cssUrl(logo));
        setVar("--decoration", cssUrl(decoration));
        const decorationPosition = getSanDecorationPosition(payload, customisation);
        const hasDecorationPosition = decorationPosition > 0;
        const shouldShowDecoration = decoration && (hasDecorationPosition || customisation.preset === "epicgames");
        setVar("--decorationdisplaytype", shouldShowDecoration ? "block" : "none");
        document.body.toggleAttribute("nodecoration", !shouldShowDecoration);
        setVar("--hiddenicon", cssUrl(customisation.hiddenicon));
        setVar("--primarycolor", customisation.primarycolor || "#203e7a");
        setVar("--secondarycolor", customisation.secondarycolor || "#0c2a66");
        setVar("--tertiarycolor", customisation.tertiarycolor || "#ffffff");
        setVar("--fontcolor", customisation.fontcolor || "#ffffff");
        setVar(
          "--glow",
          customisation.glow
            ? `drop-shadow(${(safeNumber(customisation.glowx, 0) * scale) / 10}px ${(safeNumber(customisation.glowy, 0) * scale) / 10}px var(--glowsize) var(--glowcolor))`
            : "none",
        );
        setVar("--glowsize", `${(safeNumber(customisation.glowsize, 50) / 100) * 0.6}rem`);
        setVar(
          "--glowcolor",
          getSanTierValue(customisation, "glowrarity", "glowcolor", customisation.glowcolor || "#8a2be2", percent.tier),
        );
        setVar(
          "--glowanim",
          customisation.glow && customisation.glowanim && customisation.glowanim !== "off"
            ? `${customisation.glowanim} calc(var(--transition) * ${safeNumber(customisation.glowspeed, 50)}) linear infinite`
            : "none",
        );
        setVar("--blur", `${(safeNumber(customisation.blur, 0) * scale) / 50}px`);
        setVar(
          "--mask",
          customisation.mask && customisation.maskimg
            ? `${cssUrl(customisation.maskimg)} center / cover no-repeat`
            : "none",
        );
        setVar("--outline", customisation.useoutline ? customisation.outline || "solid" : "none");
        setVar("--outlinecolor", customisation.outlinecolor || "transparent");
        setVar("--outlinewidth", `${(safeNumber(customisation.outlinewidth, 0) / 25) * scale}px`);
        setVar("--iconscale", safeNumber(customisation.iconscale, 100) / 100);
        setVar("--logoscale", safeNumber(customisation.logoscale, 100) / 100);
        setVar("--decorationscale", safeNumber(customisation.decorationscale, 100) / 100);
        setVar(
          "--unlockmsgfontsize",
          safeNumber(
            customisation.usecustomfontsizes ? customisation.unlockmsgfontsize : customisation.fontsize,
            100,
          ) / 100,
        );
        setVar(
          "--titlefontsize",
          safeNumber(
            customisation.usecustomfontsizes ? customisation.titlefontsize : customisation.fontsize,
            100,
          ) / 100,
        );
        setVar(
          "--descfontsize",
          safeNumber(
            customisation.usecustomfontsizes ? customisation.descfontsize : customisation.fontsize,
            100,
          ) / 100,
        );
        setVar(
          "--unlockmsgfontcolor",
          customisation.usecustomfontcolors
            ? customisation.unlockmsgfontcolor || customisation.fontcolor || "#fff"
            : customisation.fontcolor || "#fff",
        );
        setVar(
          "--titlefontcolor",
          customisation.usecustomfontcolors
            ? customisation.titlefontcolor || customisation.fontcolor || "#fff"
            : customisation.fontcolor || "#fff",
        );
        setVar(
          "--descfontcolor",
          customisation.usecustomfontcolors
            ? customisation.descfontcolor || customisation.fontcolor || "#fff"
            : customisation.fontcolor || "#fff",
        );

        const iconBorder = customisation.iconborderrarity
          ? percent.tier === "bronze"
            ? customisation.iconborderimgbronze
            : percent.tier === "silver"
              ? customisation.iconborderimgsilver
              : percent.tier === "diamond"
                ? customisation.iconborderimgdiamond ||
                  customisation.iconborderimgsapphire ||
                  customisation.iconborderimg
                : percent.tier === "sapphire"
                ? customisation.iconborderimgsapphire ||
                  customisation.iconborderimg
                : customisation.iconborderimg
          : customisation.iconborderimg;
        setVar("--iconborder", customisation.showiconborder ? cssUrl(iconBorder) : "none");
        setVar("--iconborderpos", customisation.iconborderpos === "back" ? -1 : 99);
        setVar("--iconborderscale", safeNumber(customisation.iconborderscale, 100) / 100);
        setVar("--iconborderx", safeNumber(customisation.iconborderx, 0));
        setVar("--iconbordery", safeNumber(customisation.iconbordery, 0));
        setVar("--textvspace", safeNumber(customisation.textvspace, 0));
        setVar("--badgecolor", getActiveSanBadgeValue(payload, customisation, "percentbadgecolor", "#203e7a"));
        setVar(
          "--badgefontcolor",
          getActiveSanBadgeValue(payload, customisation, "percentbadgefontcolor", "#ffffff"),
        );
        const badgePosition = resolveSanBadgePosition(
          isScreenshotSanMode(payload, customisation)
            ? customisation.sspercentbadgepos
            : customisation.percentbadgepos,
        );
        setVar("--badgeposx", "auto");
        setVar("--badgeposy", "auto");
        const badgeFontSize = safeNumber(
          getActiveSanBadgeValue(payload, customisation, "percentbadgefontsize", 100),
          100,
        );
        setVar("--badgesize", `${(badgeFontSize / 10) * scale}px`);
        const badgeRoundness = safeNumber(
          getActiveSanBadgeValue(payload, customisation, "percentbadgeroundness", 50),
          50,
        );
        setVar(
          "--badgeroundness",
          badgeRoundness === 100
            ? "50%"
            : `${badgeFontSize / 4 / Math.max(0.1, badgeRoundness / 10)}px`,
        );
        const badgeAsset =
          percent.tier === "psnplatinum"
            ? getActiveSanBadgeValue(payload, customisation, "percentbadgeimgplatinum") ||
              getActiveSanBadgeValue(payload, customisation, "percentbadgeimggold")
            : percent.tier === "diamond"
            ? getActiveSanBadgeValue(payload, customisation, "percentbadgeimgdiamond") ||
              getActiveSanBadgeValue(payload, customisation, "percentbadgeimgsapphire") ||
              getActiveSanBadgeValue(payload, customisation, "percentbadgeimggold")
            : percent.tier === "sapphire"
            ? getActiveSanBadgeValue(payload, customisation, "percentbadgeimgsapphire") ||
              getActiveSanBadgeValue(payload, customisation, "percentbadgeimggold")
            : percent.tier === "gold"
            ? getActiveSanBadgeValue(payload, customisation, "percentbadgeimggold")
            : percent.tier === "silver"
              ? getActiveSanBadgeValue(payload, customisation, "percentbadgeimgsilver")
              : getActiveSanBadgeValue(payload, customisation, "percentbadgeimgbronze");
        setVar(
          "--badgeimg",
          getActiveSanBadgeValue(payload, customisation, "percentbadgeimg") ? cssUrl(badgeAsset) : "none",
        );

        const achicon = document.getElementById("achicon");
        if (achicon) {
          const defaultAchIcon = customisation.defaultAchIcon || "";
          const platinumIcon = payload?.isPlatinum
            ? getPlatinumIcon(customisation)
            : "";
          // Xbox presets: a theme that sets a custom image icon (the Xbox animation) keeps it in
          // the icon slot. The real achievement icon moves to a circle on the far right.
          const useThemeIcon =
            customisation.preset === "xboxone" &&
            customisation.usecustomimgicon === true &&
            !!customisation.customimgicon &&
            !isScreenshotSanMode(payload, customisation);
          // The theme's animation wins over the platinum ribbon too, so a Mythic theme keeps its
          // Xbox emblem animation for full-completion unlocks.
          const customIcon = useThemeIcon
            ? customisation.customimgicon
            : platinumIcon ||
              payload?.iconPath ||
              (customisation.usecustomimgicon && customisation.customimgicon
                ? customisation.customimgicon
                : "");
          document.getElementById("rightachicon")?.remove();
          document.body.removeAttribute("rightachicon");
          const rightHost = document.getElementById("achcont");
          // Full-completion (platinum) unlocks and the Mythic themes have no achievement icon.
          const themeName = `${payload?.sanTheme?.label || ""} ${String(payload?.sanTheme?.cacheDir || "").split(/[\\/]/).pop()}`;
          const hideRightIcon = payload?.isPlatinum === true || /mythic/i.test(themeName);
          if (useThemeIcon && !hideRightIcon && payload?.iconPath && rightHost) {
            const rightWrap = document.createElement("div");
            rightWrap.id = "rightachicon";
            const rightImg = document.createElement("img");
            rightImg.draggable = false;
            rightImg.onerror = () => {
              rightWrap.remove();
              document.body.removeAttribute("rightachicon");
            };
            rightImg.src = fileUrl(payload.iconPath);
            rightWrap.appendChild(rightImg);
            rightHost.appendChild(rightWrap);
            document.body.setAttribute("rightachicon", "");
          }
          const fallbackIconUrl = fileUrl(defaultAchIcon);
          achicon.onerror = () => {
            if (fallbackIconUrl && achicon.src !== fallbackIconUrl) {
              achicon.src = fallbackIconUrl;
            }
          };
          achicon.src = fileUrl(customIcon || defaultAchIcon);
        }

        setTextElements(payload, customisation, percent);
        setBadge(payload, customisation, percent);
      }

      /* Optional element overrides from the addon's own notification settings. They only change
         what the theme's text/icon elements show and how large they are; the preset's layout,
         animation and styling are left alone. */
      function applyUpstreamElements(up) {
        if (!up) return;
        const hide = (id) => { const el = document.getElementById(id); if (el) el.style.display = "none"; };
        const scaleFont = (id, factor) => {
          const el = document.getElementById(id);
          if (!el || !factor || Math.abs(factor - 1) < 0.01) return;
          const size = parseFloat(getComputedStyle(el).fontSize);
          if (size > 0) el.style.fontSize = (size * factor) + "px";
        };
        if (up.showHeader === false) hide("unlockmsg");
        if (up.showName === false) hide("title");
        if (up.showDescription === false) hide("desc");
        if (up.showIcon === false) { hide("achiconwrapper"); hide("rightachicon"); }
        if (up.showRarityPercent === false) {
          document.querySelectorAll("[id*='percent'], [class*='percent']").forEach((el) => { el.style.display = "none"; });
        }
        scaleFont("unlockmsg", up.headerScale);
        scaleFont("title", up.titleScale);
        scaleFont("desc", up.bodyScale);
        if (up.fontFamily) {
          ["unlockmsg", "title", "desc"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.style.fontFamily = '"' + up.fontFamily + '", ' + (getComputedStyle(el).fontFamily || "sans-serif");
          });
        }
        if (up.rarityColor && up.rarityColoredName) {
          const title = document.getElementById("title");
          if (title) title.style.color = up.rarityColor;
        }
        if (up.rarityColor && up.glow) {
          const target = document.getElementById("outerwrapper") || document.body;
          target.style.filter = "drop-shadow(0 0 10px " + up.rarityColor + ") drop-shadow(0 0 18px " + up.rarityColor + ")";
        }
      }

      /* Rarity pill: a small badge that follows the achievement icon (the circle on the far right
         for the Xbox presets, the icon slot for the others) and fades with it. */
      function paVisualOpacity(el) {
        let o = 1;
        for (let c = el; c instanceof Element; c = c.parentElement) {
          const st = getComputedStyle(c);
          if (st.display === "none" || st.visibility === "hidden") return 0;
          const v = parseFloat(st.opacity);
          if (Number.isFinite(v)) o *= v;
          if (o < 0.01) return 0;
        }
        return o;
      }

      function paFormatPercent(value) {
        const v = Math.min(100, Math.max(0, Number(value)));
        const text = Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/\.?0+$/, "");
        return text + "%";
      }

      function paSetupPill(payload) {
        const cfg = payload && payload.paPill;
        document.getElementById("pa-rarity-pill")?.remove();
        if (!cfg || !cfg.show || !Number.isFinite(Number(cfg.percent))) return;
        const icon = document.querySelector("body[rightachicon] #rightachicon img") || document.getElementById("achicon");
        if (!icon) return;
        const pill = document.createElement("div");
        pill.id = "pa-rarity-pill";
        pill.textContent = paFormatPercent(cfg.percent);
        if (cfg.tier) pill.classList.add("t-" + cfg.tier);
        document.documentElement.appendChild(pill);
        const tick = () => {
          if (!icon.isConnected || !pill.isConnected) return;
          const r = icon.getBoundingClientRect();
          const ready = icon.complete && icon.naturalWidth > 0 && r.width >= 8 && r.height >= 8 &&
            r.left + r.width / 2 > 0 && r.left + r.width / 2 < window.innerWidth && paVisualOpacity(icon) >= 0.35;
          pill.style.opacity = ready ? "1" : "0";
          pill.style.visibility = ready ? "visible" : "hidden";
          if (ready) {
            const h = pill.offsetHeight || 18;
            pill.style.left = (r.left + r.width / 2) + "px";
            pill.style.top = Math.min(r.bottom + 4, Math.max(0, window.innerHeight - h - 2)) + "px";
          }
          requestAnimationFrame(tick);
        };
        tick();
      }

      function paDecodeImages(urls, timeoutMs) {
        const jobs = (urls || []).filter(Boolean).map((url) => new Promise((resolve) => {
          const img = new Image();
          img.onload = () => (img.decode ? img.decode().then(resolve, resolve) : resolve());
          img.onerror = () => resolve();
          img.src = url;
        }));
        return Promise.race([Promise.all(jobs), new Promise((resolve) => setTimeout(resolve, timeoutMs))]);
      }

      function notifyReady() {
        const urls = window.__paPreload || [];
        window.__paPreload = null;
        paDecodeImages(urls, 1500).then(() => paShow());
      }

      function paShow() {
        setVar("--bodyopacity", "1");
        setTimeout(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.api?.notificationRenderReady?.();
            });
          });
        }, 120);
      }

      window.api?.onNotification?.((payload) => {
        // The pill replaces whatever percentage the theme would draw itself.
        if (payload && payload.paPill) payload.showRarityPercentage = false;
        const theme = payload?.sanTheme || {};
        const customisation = {
          ...(theme.customisation || {}),
        };
        customisation.preset = String(customisation.preset || theme.preset || "default").toLowerCase();
        // Mythic Xbox themes enlarge the animated emblem, which then completely covers the laurel
        // behind it. The Achievements app draws that laurel in front of the emblem, so do the same.
        if (customisation.preset === "xboxone" && customisation.showiconborder &&
            /mythic/i.test(`${theme.label || ""} ${String(theme.cacheDir || "").split(/[\\/]/).pop()}`)) {
          customisation.iconborderpos = "front";
        }

        // The presets size all text from the root font size, which SAN's CSS derives from the browser
        // viewport (3vmax). Pin it to the notification window the host created so a viewport that is
        // not the window size (warm host, DPI) can no longer inflate every font.
        if (payload && payload.windowDip) {
          const longest = Math.max(Number(payload.windowDip.width) || 0, Number(payload.windowDip.height) || 0);
          if (longest > 0) {
            document.documentElement.style.setProperty("font-size", (0.03 * longest + 0.8).toFixed(3) + "px", "important");
          }
        }

        Promise.all([
          loadCss("san-global-css", theme.runtime?.globalCssUrl),
          loadCss("san-base-css", theme.runtime?.baseCssUrl),
          loadCss("san-baseanim-css", theme.runtime?.baseAnimCssUrl),
          loadCss("san-preset-css", theme.runtime?.presetCssUrl),
        ]).then(() => {
          document.body.insertAdjacentHTML("beforeend", theme.presetHtml || "");
          setBodyAttributes(payload, customisation);
          applyCustomFont(customisation);
          applySanVariables(payload, customisation);
          try { applyUpstreamElements(payload.upstream); } catch (e) {}
          try { paSetupPill(payload); } catch (e) {}
          window.__paPreload = [payload.headerPath, payload.gameIconPath, payload.iconPath]
            .filter(Boolean).map((p) => fileUrl(p));
          notifyReady();
        });
      });
    </script>
    <script>
      if (window.__SAN_PAYLOAD__ && window.__sanCb) window.__sanCb(window.__SAN_PAYLOAD__);
    </script>
  </body>
</html>
